<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restobar By Sol · En construcción</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Restobar By Sol — estamos preparando nuestra web.">
<meta name="theme-color" content="#0A0611">
<link rel="icon" href="img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#0A0611; --sol:#FF8A1F; --sol-hot:#F45B0B;
  --neon-magenta:#FF3EA5; --neon-violeta:#A56BFF; --texto:#EFE6F5; --texto-suave:#B8A9C6;
  --f-display:'Anton',system-ui,sans-serif; --f-body:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem 1.2rem;
  font-family:var(--f-body);color:var(--texto);background:var(--noche);overflow-x:hidden;text-align:center}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
body::before{width:46vmax;height:46vmax;background:rgba(165,107,255,.42);top:-16vmax;left:-16vmax}
body::after{width:40vmax;height:40vmax;background:rgba(255,62,165,.3);bottom:-16vmax;right:-14vmax}

.caja{position:relative;z-index:2;max-width:560px;width:100%}

/* ---- Logo ---- */
.marco{position:relative;width:min(62vw,230px);margin:0 auto 2.2rem;aspect-ratio:1;display:grid;place-items:center}
.aro{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(255,138,31,.45);animation:girar 26s linear infinite}
.aro::after{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;border-radius:50%;
  background:var(--sol);box-shadow:0 0 16px 5px rgba(255,138,31,.8);transform:translateX(-50%)}
@keyframes girar{to{transform:rotate(360deg)}}
.logo{width:82%;border-radius:50%;display:block;
  filter:drop-shadow(0 0 30px rgba(165,107,255,.75)) drop-shadow(0 0 60px rgba(255,62,165,.45));
  animation:parpadeo 6s infinite}
@keyframes parpadeo{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.7}49%{opacity:1}73%{opacity:.82}74%{opacity:1}}

/* ---- Texto ---- */
.eyebrow{font-size:.76rem;letter-spacing:.3em;text-transform:uppercase;color:var(--sol);
  font-weight:600;margin:0 0 1rem}
h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;
  font-size:clamp(2.3rem,10vw,4.4rem);line-height:.95;margin:0;color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,.45),0 0 28px var(--neon-magenta),0 0 56px rgba(255,62,165,.55)}
h1 small{display:block;font-size:.36em;letter-spacing:.06em;color:var(--sol);
  text-shadow:0 0 18px rgba(255,138,31,.7);margin-top:.5rem}
p{color:var(--texto-suave);font-size:1.05rem;line-height:1.65;margin:1.6rem auto 0;max-width:40ch}

/* ---- Barra ---- */
.barra{position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.1);
  overflow:hidden;margin:2.4rem auto 0;max-width:280px}
.barra span{position:absolute;inset:0;width:40%;border-radius:99px;
  background:linear-gradient(90deg,var(--sol-hot),var(--sol),var(--neon-magenta));
  animation:correr 2.6s ease-in-out infinite}
@keyframes correr{0%{left:-40%}100%{left:100%}}

/* ---- Contacto (bórralo si no lo quieres) ---- */
.wa{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;margin-top:2.4rem;
  padding:.95rem 1.7rem;border-radius:999px;background:#1FBF63;color:#fff;font-weight:600;
  text-decoration:none;box-shadow:0 14px 34px -12px rgba(31,191,99,.9);
  transition:transform .25s cubic-bezier(.2,.8,.3,1)}
.wa:hover,.wa:focus-visible{transform:translateY(-3px) scale(1.02)}
.wa svg{width:20px;height:20px;fill:currentColor}
.pie{margin-top:2.6rem;font-size:.85rem;color:#8C7C9B}

a:focus-visible{outline:2px solid var(--sol);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <main class="caja">

    <div class="marco">
      <div class="aro"></div>
      <img class="logo" src="img/logo.webp" alt="Restobar By Sol" onerror="this.style.display='none'">
    </div>

    <p class="eyebrow">Restobar By Sol</p>

    <h1>
      En construcción
      <small>Volvemos muy pronto</small>
    </h1>

    <p>Estamos preparando nuestra web para enseñarte todo lo que se cocina aquí. Mientras tanto, la cocina sigue encendida.</p>

    <div class="barra"><span></span></div>

    <!-- ===== Botón de WhatsApp — borra este bloque si no quieres contacto ===== -->
    <a class="wa" href="https://wa.me/34636521691?text=%C2%A1Hola%20Restobar%20By%20Sol!" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5 0-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.2-.6-.4M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2m0 1.7a8.3 8.3 0 0 1 6.6 13.3 8.3 8.3 0 0 1-10.9 2.3l-.4-.2-3.1.8.8-3-.2-.4A8.3 8.3 0 0 1 12 3.7"/></svg>
      Escríbenos por WhatsApp
    </a>
    <!-- ===== fin del bloque de WhatsApp ===== -->

    <p class="pie">Mercado Guillermo de Osma · Madrid</p>

  </main>
</body>
</html>
